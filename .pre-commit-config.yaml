repos:
  - repo: git@github.com:Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        additional_dependencies: ["gibberish-detector"]
  
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.5.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, master, --pattern, release/.*]

  # - repo: https://github.com/gruntwork-io/pre-commit
  #   rev: v0.1.17 # Get the latest from: https://github.com/gruntwork-io/pre-commit/releases
  #   hooks:
  #   - id: helmlint
  #

  - repo: https://github.com/norwoodj/helm-docs
    rev: "v1.14.2"
    hooks:
    #  Use a pinned version of helm-docs in a container to generate consistent documentation.
      - name: helm-docs
        id: helm-docs-container
        entry: jnorwood/helm-docs:v1.14.2
        args:
        - "--chart-search-root=helm"
        - "--skip-version-footer"
        # Shared template: omits the version badge and dependency version
        # column, which are frozen placeholders in git rather than real values.
        - "--template-files=/helm-docs/.helm-docs/README.md.gotmpl"