# A single-pod Grafana + Prometheus + Tempo + Loki + Pyroscope stack for local development, backing the
# Alloy install described in docs/local-observability.md. Apply with:
#
#   kubectl apply -f examples/local_lgtm.yaml
#
# Adapted from the manifest published by grafana/docker-otel-lgtm, with two changes: the Loki
# port is exposed, so Alloy has somewhere to send logs, and the Pyroscope port is exposed, so
# services can push profiles. Both already listen inside the image; a Service that omits the port
# drops the traffic rather than refusing it.
#
# For local development only. One replica, emptyDir storage for the telemetry so it is lost on
# restart while dashboards persist on a small claim,
# no ingress, no TLS, and Grafana's default admin/admin. The observability chart is the answer
# for a deployed cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Dashboards outlive the pod; telemetry does not. kind's default local-path StorageClass keeps
# this on the node, so it survives a pod restart and a `docker restart`, and goes away with
# `kind delete cluster` or by deleting the claim - which is how you reset Grafana.
#
# examples/dashboards/ stays the source of truth. Editing a dashboard in the UI now sticks, so
# export it back to the file or the next fresh cluster will not have the change.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-grafana
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.30.2
          # Do not add PROMETHEUS_EXTRA_ARGS=--web.enable-remote-write-receiver. The image's
          # run-prometheus.sh already passes that flag, and appending a second copy stops
          # Prometheus from starting at all, which shows up only as the pod never going Ready.
          env:
            # Gen3 pods carry enough labels that Alloy's labelmap of them exceeds Loki's
            # default of 15 per stream, and every log push is then rejected with a 400.
            # Old entries are accepted too, because the pod tailers start from the beginning
            # of each pod's log rather than from now.
            - name: LOKI_EXTRA_ARGS
              value: "-validation.max-label-names-per-series=32 -validation.reject-old-samples=false"
            # Pyroscope refuses any query longer than its default max_query_length of 1d with
            # "the query time range exceeds the limit", which in Grafana surfaces only as
            # "An error occurred within the plugin" on every profile panel at once. 0 disables
            # the check. max-query-lookback stays at its 1w default, so a longer window returns
            # the last week rather than failing.
            - name: PYROSCOPE_EXTRA_ARGS
              value: "-querier.max-query-length=0"
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: loki, containerPort: 3100 }
            - { name: tempo, containerPort: 3200 }
            - { name: otel-grpc, containerPort: 4317 }
            - { name: otel-http, containerPort: 4318 }
            - { name: prometheus, containerPort: 9090 }
            - { name: pyroscope, containerPort: 4040 }
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
          volumeMounts:
            - { name: tempo-data, mountPath: /data/tempo }
            - { name: grafana-data, mountPath: /data/grafana }
            - { name: loki-data, mountPath: /data/loki }
            - { name: loki-storage, mountPath: /loki }
            - { name: p8s-storage, mountPath: /data/prometheus }
            - { name: pyroscope-storage, mountPath: /data/pyroscope }
      volumes:
        - { name: tempo-data, emptyDir: {} }
        # Only Grafana's own volume persists: GF_PATHS_DATA is /data/grafana/data, so
        # this is the dashboard database and the plugin directory and nothing else.
        # Metrics, logs, traces and profiles stay on emptyDir and start clean.
        - name: grafana-data
          persistentVolumeClaim:
            claimName: lgtm-grafana
        - { name: loki-data, emptyDir: {} }
        - { name: loki-storage, emptyDir: {} }
        - { name: p8s-storage, emptyDir: {} }
        - { name: pyroscope-storage, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: monitoring
spec:
  selector:
    app: lgtm
  ports:
    - { name: grafana, port: 3000, targetPort: 3000 }
    - { name: loki, port: 3100, targetPort: 3100 }
    - { name: tempo, port: 3200, targetPort: 3200 }
    - { name: otel-grpc, port: 4317, targetPort: 4317 }
    - { name: otel-http, port: 4318, targetPort: 4318 }
    - { name: prometheus, port: 9090, targetPort: 9090 }
    - { name: pyroscope, port: 4040, targetPort: 4040 }
