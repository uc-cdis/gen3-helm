global:
  hostname: "gen3.apps-crc.testing"
  frontendRoot: "gen3ff"

ambassador:
  enabled: false
  service:
    targetPort: 8080

arborist:
  enabled: true
  image:
    tag: openshift
  service:
    targetPort: 8080

argo-wrapper:
  enabled: false
  service:
    targetPort: 8000

audit:
  enabled: false
  service:
    targetPort: 8000

aws-es-proxy:
  enabled: false
  service:
    targetPort: 8080

fence:
  enabled: true
  service:
    targetPort: 8000
  FENCE_CONFIG:
    MOCK_GOOGLE_AUTH: true
  resources:
    # namespace LimitRange defaults to a 200m cpu limit, which throttles
    # fence badly under real traffic (multi-second responses on /user/user)
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

cedar:
  enabled: false
  service:
    targetPort: 8000

cohort-middleware:
  enabled: false
  service:
    targetPort: 8080

gen3-analysis:
  enabled: false
  service:
    targetPort: 8000

gen3-user-data-library:
  enabled: false
  service:
    targetPort: 8000

gen3-workflow:
  enabled: false
  service:
    targetPort: 8080

guppy:
  enabled: false
  service:
    targetPort: 8080

hatchery:
  enabled: false
  service:
    targetPort: 8000

indexd:
  enabled: true
  service:
    targetPort: 8000

manifestservice:
  enabled: false
  service:
    targetPort: 8000

metadata:
  enabled: false
  service:
    targetPort: 8000

ohdsi-atlas:
  enabled: false
  service:
    targetPort: 8080

ohdsi-webapi:
  enabled: false
  service:
    targetPort: 8080

orthanc:
  enabled: false
  service:
    targetPort: 8042

peregrine:
  enabled: true
  service:
    targetPort: 8000

portal:
  enabled: false

frontend-framework:
  enabled: true
  service:
    type: ClusterIP
    port: 80
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000

requestor:
  enabled: false
  service:
    targetPort: 8000

revproxy:
  enabled: true
  nginx:
    resolver: "172.30.0.10"
    user: nginx
    pidFile: /tmp/nginx.pid
  service:
    targetPort: 8000
  resources:
    # revproxy is the single ingress point for all traffic; the namespace
    # LimitRange default (200m) is too tight once more than a couple of
    # requests land concurrently
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  openshiftRoute:
    enabled: true
    annotations: {}
    host: "gen3.apps-crc.testing"
    path: "/"
    targetPort: "http"
    tls:
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"
    wildcardPolicy: "None"

  podSecurityContext: 
    fsGroup: 2000

  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000


sheepdog:
  enabled: true
  service:
    targetPort: 8000

ssjdispatcher:
  enabled: false
  service:
    targetPort: 8080

wts:
  enabled: false
  oidc_job_openshift: true
  service:
    targetPort: 8000

sower:
  enabled: false
  service:
    targetPort: 8000

ohif-viewer:
  enabled: false
  service:
    targetPort: 8080

dicom-server:
  enabled: false
  service:
    targetPort: 8042

access-backend:
  enabled: false
  service:
    targetPort: 8001

postgresql:
  # NOTE: no image override here - the umbrella chart's default
  # (quay.io/cdis/docker-bitnami-pgvector:16) is used because upstream
  # bitnamilegacy/postgresql tags now require registry auth and 401 on pull
  primary:
    persistence:
      enabled: false
    podSecurityContext:
      fsGroup: 1000660001
    containerSecurityContext:
      runAsUser: 1000660001
      allowPrivilegeEscalation: false
      seccompProfile:
        type: "RuntimeDefault"
    resources:
      # namespace LimitRange defaults containers to a 200m cpu limit; the
      # chart's default cpu request (250m) exceeds that unless a limit is set
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

elasticsearch:
  image: "quay.io/cdis/elasticsearch"
  imageTag: "7.10.2"
  clusterName: gen3-elasticsearch
  maxUnavailable: 0
  singleNode: true
  replicas: 1
  sysctlInitContainer:
    enabled: false
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  esConfig:
    elasticsearch.yml: |
  podSecurityContext:
    fsGroup: 1000950000
    runAsUser: 1000950000

  securityContext:
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1000950000

