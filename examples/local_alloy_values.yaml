# GENERATED by .github/scripts/regenerate_local_alloy_values.py - re-run that script rather than
# editing alloyConfigmapData below by hand.
#
# Grafana Alloy sized for a kind cluster, writing to the single-pod LGTM stack described in
# docs/local-observability.md. Install with:
#
#   helm dependency update helm/alloy
#   helm upgrade --install alloy ./helm/alloy -n monitoring -f examples/local_alloy_values.yaml
#
# The release must be named `alloy` in namespace `monitoring`: that is the collector address
# Gen3 service images have baked in as OTEL_EXPORTER_OTLP_ENDPOINT.
alloy:
  controller:
    type: deployment
    replicas: 1
    # helm/alloy/values.yaml pins Alloy to topology.kubernetes.io/zone=us-east-1a. A kind node
    # carries no zone label, so without this the pod never leaves Pending. It has to be null
    # rather than {}: Helm merges an empty map, which leaves the chart's affinity in place, and
    # only an explicit null deletes the key.
    affinity: null

  alloy:
    stabilityLevel: "public-preview"
    uiPathPrefix: /alloy
    # Lists replace rather than merge, so the OTLP ports have to be restated here.
    extraPorts:
      - name: "otel-grpc"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
      - name: "otel-http"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
    # A single replica has nobody to gossip with, and the peer lookups are noise in the logs.
    clustering:
      enabled: false
    # The parent chart renders the alloy-gen3 ConfigMap; letting the subchart render one too
    # would collide on the name.
    configMap:
      create: false
      name: alloy-gen3
      key: config
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  # Copied from helm/alloy/values.yaml, changing the three write endpoints and the two external
  # labels, and inserting two things the chart has no equivalent of: the loki.process stage that
  # follows the pod log source, and the cAdvisor scrape. Both are local-only, so trace-to-logs
  # correlation and per-container memory and CPU work here and not in a cluster deployed from
  # helm/alloy. See docs/otel-logs-and-traces.md.
  #
  # The labels are written out literally on purpose. templates/alloy-config.yaml renders this
  # with toYaml rather than tpl, so any {{ }} left in here reaches the ConfigMap unrendered.
  alloyConfigmapData: |
    logging {
      level    = "info"
      format   = "json"
      write_to = [loki.write.endpoint.receiver]
    }

    /////////////////////// OTLP START ///////////////////////

    otelcol.receiver.otlp "default" {
      grpc {}
      http {}

      output {
        metrics = [otelcol.processor.batch.default.input]
        traces = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "lgtm.monitoring:4317"
        // Configure TLS settings for communicating with the endpoint.
        tls {
            // The connection is insecure.
            insecure = true
            // Do not verify TLS certificates when connecting.
            insecure_skip_verify = true
        }
      }
    }


    /////////////////////// OTLP END ///////////////////////

    // discover all pods, to be used later in this config
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // discover all services, to be used later in this config
    discovery.kubernetes "services" {
      role = "service"
    }

    // discover all nodes, to be used later in this config
    discovery.kubernetes "nodes" {
      role = "node"
    }

    // Generic scrape of any pod with Annotation "prometheus.io/scrape: true"
    discovery.relabel "annotation_autodiscovery_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex = "true"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_job"]
        action = "replace"
        target_label = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_instance"]
        action = "replace"
        target_label = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        action = "replace"
        target_label = "__metrics_path__"
      }

      // Choose the pod port
      // The discovery generates a target for each declared container port of the pod.
      // If the metricsPortName annotation has value, keep only the target where the port name matches the one of the annotation.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_portName"]
        regex = "(.+)"
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        action = "keepequal"
        target_label = "__tmp_port"
      }

      // If the metrics port number annotation has a value, override the target address to use it, regardless whether it is
      // one of the declared ports on that Pod.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
        regex = "(\\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})"
        replacement = "[$2]:$1" // IPv6
        target_label = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
        regex = "(\\d+);((([0-9]+?)(\\.|$)){4})" // IPv4, takes priority over IPv6 when both exists
        replacement = "$2:$1"
        target_label = "__address__"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
        action = "replace"
        target_label = "__scheme__"
      }


      // add labels
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        target_label = "controller"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }


      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "app"
      }

      // map all labels
      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_label_(.+)"
      }
    }

    // Generic scrape of any service with
    // Annotation Autodiscovery
    discovery.relabel "annotation_autodiscovery_services" {
      targets = discovery.kubernetes.services.targets
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
        regex = "true"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_job"]
        action = "replace"
        target_label = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_instance"]
        action = "replace"
        target_label = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
        action = "replace"
        target_label = "__metrics_path__"
      }

      // Choose the service port
      rule {
        source_labels = ["__meta_kubernetes_service_port_name"]
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_portName"]
        regex = "(.+)"
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_port_name"]
        action = "keepequal"
        target_label = "__tmp_port"
      }

      rule {
        source_labels = ["__meta_kubernetes_service_port_number"]
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_port"]
        regex = "(.+)"
        target_label = "__tmp_port"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_port_number"]
        action = "keepequal"
        target_label = "__tmp_port"
      }

      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scheme"]
        action = "replace"
        target_label = "__scheme__"
      }
    }

    prometheus.scrape "metrics" {
      job_name   = "integrations/autodiscovery_metrics"
      targets  = concat(discovery.relabel.annotation_autodiscovery_pods.output, discovery.relabel.annotation_autodiscovery_services.output)
      honor_labels = true
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.metrics_service.receiver]
    }


    // Node Exporter
    // TODO: replace with https://grafana.com/docs/alloy/latest/reference/components/prometheus.exporter.unix/
    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
        regex = "monitoring-extras"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex = "node-exporter"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        action = "replace"
        target_label = "instance"
      }
    }

    prometheus.scrape "node_exporter" {
      job_name   = "integrations/node_exporter"
      targets  = discovery.relabel.node_exporter.output
      scrape_interval = "60s"
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.node_exporter.receiver]
    }

    prometheus.relabel "node_exporter" {
      rule {
        source_labels = ["__name__"]
        regex = "up|node_cpu.*|node_network.*|node_exporter_build_info|node_filesystem.*|node_memory.*|process_cpu_seconds_total|process_resident_memory_bytes"
        action = "keep"
      }
      forward_to = [prometheus.relabel.metrics_service.receiver]
    }

    // Logs from all pods
    discovery.relabel "all_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        target_label = "controller"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "app"
      }

      // map all labels
      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_label_(.+)"
      }

    }

    loki.source.kubernetes "pods" {
      targets = discovery.relabel.all_pods.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    // Gen3 services log JSON carrying the OpenTelemetry trace_id. Promoting it to
    // structured metadata is what lets Grafana's trace-to-logs query filter on
    // `| trace_id = "..."` with no parser stage, which is how the Tempo datasource in
    // the local LGTM image is provisioned. It deliberately does not become a stream
    // label: a per-request value there would multiply Loki's stream cardinality.
    //
    // Lines that are not JSON, such as etcd and kube-proxy output, extract nothing and
    // pass through unchanged.
    loki.process "pod_logs" {
      forward_to = [loki.write.endpoint.receiver]

      stage.json {
        expressions = { trace_id = "trace_id", span_id = "span_id" }
      }

      stage.structured_metadata {
        values = { trace_id = "", span_id = "" }
      }

    }

    // kube-state-metrics
    discovery.relabel "relabel_kube_state_metrics" {
      targets = discovery.kubernetes.services.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex = "monitoring"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        regex = "monitoring-extras-kube-state-metrics"
        action = "keep"
      }
    }

    prometheus.scrape "kube_state_metrics" {
      targets = discovery.relabel.relabel_kube_state_metrics.output
      job_name = "kube-state-metrics"
      metrics_path = "/metrics"
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // Kubelet
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics"
        target_label  = "__metrics_path__"
      }
    }

    prometheus.scrape "kubelet" {
      job_name   = "integrations/kubernetes/kubelet"
      targets  = discovery.relabel.kubelet.output
      scheme   = "https"
      scrape_interval = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.kubelet.receiver]
    }

    prometheus.relabel "kubelet" {
      rule {
        source_labels = ["__name__"]
        regex = "up|container_cpu_usage_seconds_total|kubelet_certificate_manager_client_expiration_renew_errors|kubelet_certificate_manager_client_ttl_seconds|kubelet_certificate_manager_server_ttl_seconds|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_count|kubelet_running_container_count|kubelet_running_containers|kubelet_running_pod_count|kubelet_running_pods|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|kubelet_server_expiration_renew_errors|kubelet_volume_stats_available_bytes|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_inodes|kubelet_volume_stats_inodes_used|kubernetes_build_info|namespace_workload_pod|rest_client_requests_total|storage_operation_duration_seconds_count|storage_operation_errors_total|volume_manager_total_volumes"
        action = "keep"
      }
      forward_to = [prometheus.relabel.metrics_service.receiver]
    }

    // cAdvisor. Local-only for now; see docs/otel-logs-and-traces.md.
    //
    // The kubelet serves this on a second path, so it needs its own scrape rather than a
    // longer keep list on the kubelet one.
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
        target_label  = "__metrics_path__"
      }
    }

    prometheus.scrape "cadvisor" {
      job_name   = "integrations/kubernetes/cadvisor"
      targets  = discovery.relabel.cadvisor.output
      scheme   = "https"
      scrape_interval = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      rule {
        source_labels = ["__name__"]
        regex = "container_memory_working_set_bytes|container_memory_rss|container_spec_memory_limit_bytes|container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_spec_cpu_quota|container_spec_cpu_period|container_oom_events_total"
        action = "keep"
      }

      // cAdvisor reports one series per cgroup level. The pod and slice rollups carry an
      // empty container label and sum the containers beneath them, so keeping both counts
      // every container twice.
      rule {
        source_labels = ["container"]
        regex = ""
        action = "drop"
      }

      forward_to = [prometheus.relabel.metrics_service.receiver]
    }

    // Cluster Events
    loki.source.kubernetes_events "cluster_events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      forward_to = [loki.write.endpoint.receiver]
    }

    prometheus.relabel "metrics_service" {
      forward_to = [prometheus.remote_write.default.receiver]
    }


    // Write Endpoints
    // prometheus write endpoint
    prometheus.remote_write "default" {
      external_labels = {
        cluster = "local-kind",
        project = "local",
      }
      endpoint {
        url = "http://lgtm.monitoring:9090/api/v1/write"
      }
    }

    // loki write endpoint
    loki.write "endpoint" {
      external_labels =  {
        cluster = "local-kind",
        project = "local",
      }
      endpoint {
        url = "http://lgtm.monitoring:3100/loki/api/v1/push"
      }
    }
