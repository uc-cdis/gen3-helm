# Default values for gen3-embeddings.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- (map) AWS configuration
  aws:
    # -- (bool) Set to true if deploying to AWS. Controls ingress annotations.
    enabled: false
    # -- (string) Credentials for AWS stuff.
    awsAccessKeyId:
    # -- (string) Credentials for AWS stuff.
    awsSecretAccessKey:
    externalSecrets:
      # -- (bool) Whether to use External Secrets for aws config.
      enabled: false
      # -- (String) Name of Secrets Manager secret.
      externalSecretAwsCreds:
  # -- (bool) Whether the deployment is for development purposes.
  dev: true
  # -- (int) Minimum pods the PodDisruptionBudget keeps available. Only consulted when
  # global.pdb is set and replicaCount is above 1; the PDB renders an empty minAvailable and is
  # rejected without it.
  minAvailable: 1
  postgres:
    # -- (bool) Whether the database should be created.
    dbCreate: true
    # -- (string) Name of external secret. Disabled if empty
    externalSecret: ""
    # -- (map) Master credentials to postgres. This is going to be the default postgres server being used for each service, unless each service specifies their own postgres
    master:
      # -- (string) hostname of postgres server
      host:
      # -- (string) username of superuser in postgres. This is used to create or restore databases
      username: postgres
      # -- (string) password for superuser in postgres. This is used to create or restore databases
      password:
      # -- (string) Port for Postgres.
      port: "5432"
  # -- (map) External Secrets settings.
  externalSecrets:
    # -- (bool) Will use ExternalSecret resources to pull secrets from Secrets Manager instead of creating them locally. Be cautious as this will override any metadata secrets you have deployed.
    deploy: false
    # -- (string) Will deploy a separate External Secret Store for this service.
    separateSecretStore: false
  #  -- (map) This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    averageCPUValue: 500m
    averageMemoryValue: 500Mi
  # -- (map) Karpenter topology spread configuration.
  topologySpread:
    # -- (bool) Whether to enable topology spread constraints for all subcharts that support it.
    enabled: false
    # -- (string) The topology key to use for spreading. Defaults to "topology.kubernetes.io/zone".
    topologyKey: "topology.kubernetes.io/zone"
    # -- (int) The maxSkew to use for topology spread constraints. Defaults to 1.
    maxSkew: 1

#  -- (map) This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling: {}

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/

# -- (int) The image runs a single Uvicorn process, so concurrency comes from replicas rather
# than from workers inside the container. Replicas do not migrate: postgres.migrations runs that
# once in a Job and each replica waits for it, so this can be raised freely.
replicaCount: 2
debug: false

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: quay.io/cdis/gen3_embeddings
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: main

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  # -- (int) Port the service listens on inside the container. Also the container port the
  # probes address by name, so changing it here moves the Service, the container port and both
  # probes together.
  targetPort: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- (map) Compute resources. Sized for the single Uvicorn process the image runs; add
# replicas rather than raising these to serve more concurrent traffic. The same values apply
# to the migration initContainer.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# -- (list) Environment variables to pass to the container
env:
  - name: GEN3_DEBUG
    value: "false"
  - name: ARBORIST_URL
    valueFrom:
      configMapKeyRef:
        name: manifest-global
        key: arborist_url
        optional: true
  - name: PGPOOL_MIN_SIZE
    value: "1"
  - name: PGPOOL_MAX_SIZE
    value: "5"

# -- (map) Public, non-secret environment variables, by their real ALL_UPPER name. Prefer this
# over `env` for per-environment settings: Helm replaces lists wholesale, so overriding `env`
# drops the defaults above, while map keys merge. Rendered after `env`, so a name set in both
# resolves here. Values must be scalars; use `env` for anything needing `valueFrom`. Secret
# values belong in `secretEnv` or Secrets Manager, not here - this file is public.
extraEnv: {}

# -- (map) Secret environment variables, rendered into the <name>-env-secret Secret and
# projected with envFrom. Intended for local development only: when
# global.externalSecrets.deploy is set, this Secret is populated from Secrets Manager instead and
# anything here is ignored. Never commit real credentials to a public values file.
secretEnv: {}

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

# -- (map) Liveness probe. `port: http` follows service.targetPort, so the probe cannot drift
# from the port the container actually listens on.
livenessProbe:
  httpGet:
    path: /_status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60
  timeoutSeconds: 30
# -- (map) Readiness probe. Removes the pod from the Service until /_status answers.
readinessProbe:
  httpGet:
    path: /_status
    port: http

# -- (list) Additional volumes on the output Deployment definition.
extraVolumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /services/gen3_embeddings/.env
    name: gen3-embeddings-g3auto-volume
    readOnly: true
    subPath: gen3-embeddings.env

affinity: {}
automountServiceAccountToken: false

# -- (map) Postgres database configuration. If db does not exist in postgres cluster and dbCreate is set ot true then these databases will be created for you
postgres:
  # (bool) Whether the database should be restored from s3. Default to global.postgres.dbRestore
  dbRestore: false
  # -- (bool) Whether the database should be created. Default to global.postgres.dbCreate
  dbCreate:
  # -- (string) Hostname for postgres server. This is a service override, defaults to global.postgres.host
  host:
  # -- (string) Database name for postgres. This is a service override, defaults to <serviceName>-<releaseName>
  database:
  # -- (string) Username for postgres. This is a service override, defaults to <serviceName>-<releaseName>
  username:
  # -- (string) Port for Postgres.
  port: "5432"
  # -- (string) Password for Postgres. Will be autogenerated if left empty.
  password:
  # -- (string) Will create a Database for the individual service to help with developing it.
  separate: false
  # -- (map) dbmate schema migrations. dbmate takes no lock while migrating, so migrations run in
  # a single Job with parallelism 1 and the deployment waits for them rather than each replica
  # racing to apply the same migration.
  migrations:
    # -- (bool) Run migrations as a Job, and make the deployment wait for them before serving.
    enabled: true
    # -- (string) Directory inside the image holding dbmate migrations.
    dir: /services/gen3_embeddings/db/migrations
    # -- (string) sslmode for the migration connection.
    sslmode: disable
# -- (map) Postgresql subchart settings if deployed separately option is set to "true".
# Disable persistence by default so we can spin up and down ephemeral environments
postgresql:
  primary:
    persistence:
      # -- (bool) Option to persist the dbs data.
      enabled: false

# Values to determine the labels that are used for the deployment, pod, etc.
# -- (string) Valid options are "production" or "dev". If invalid option is set- the value will default to "dev".
release: "production"
# -- (string) Valid options are "true" or "false". If invalid option is set- the value will default to "false".
criticalService: "false"
# -- (string) Label to help organize pods and their use. Any value is valid, but use "_" or "-" to divide words.
partOf: "Embeddings"
# -- (map) Will completely override the selectorLabels defined in the common chart's _label_setup.tpl
selectorLabels:
# -- (map) Will completely override the commonLabels defined in the common chart's _label_setup.tpl
commonLabels:

# -- (map) External Secrets settings.
externalSecrets:
  # -- (string) Will create the Helm "gen3Embeddings-g3auto" secret even if Secrets Manager is enabled. This is helpful if you are wanting to use External Secrets for some, but not all secrets.
  createK8sGen3EmbeddingsSecret: false
  # -- (string) Will override the name of the aws secrets manager secret. Default is "gen3embeddings-g3auto"
  gen3EmbeddingsG3auto:
  # -- (string) Will override the name of both the Secret holding secret environment variables
  # and the aws secrets manager secret it is populated from. Default is
  # "gen3-embeddings-env-secret".
  gen3EmbeddingsEnvSecret:
  # -- (bool) Whether to create the database and Secrets Manager secrets via PushSecret.
  pushSecret: false
  # -- (string) Will override the name of the aws secrets manager secret. Default is "Values.global.environment-.Chart.Name-creds"
  dbcreds:

# -- (bool) Whether Metrics are enabled.
metricsEnabled:

# -- (map) Secret information to access the db restore job S3 bucket.
secrets:
  # -- (str) AWS access key ID. Overrides global key.
  awsAccessKeyId:
  # -- (str) AWS secret access key ID. Overrides global key.
  awsSecretAccessKey:
