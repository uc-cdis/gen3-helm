{{- /*
  The app-user Job's pod template, separate so the Job name can hash it. Emitted at column 0.
*/}}
{{- define "gen3-embeddings.appUserPod" -}}
{{- $appUser := include "gen3-embeddings.appUser" . | fromYaml }}
{{- $migrations := include "common.db_migrate.settings" . | fromYaml }}
{{- $tag := .Values.image.tag | default .Chart.AppVersion }}
metadata:
  labels:
    {{- /* Required: common.db_netpolicy grants database egress to app in (<chart>, gen3job). */}}
    app: gen3job
spec:
  {{- /* For kubectl on the app Secret; the Role behind it allows secrets. */}}
  serviceAccountName: {{ .Chart.Name }}-dbcreate-sa
  restartPolicy: OnFailure
  volumes:
    - name: work
      emptyDir: {}
  initContainers:
    {{- /* The grants name the tables, so they wait for the finished schema. app_user.sql ships
           in the service image, which has dbmate but no psql. */}}
    - name: wait-and-copy
      image: "{{ .Values.image.repository }}:{{ $tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        {{- include "common.db_migrate.env" . | nindent 8 }}
      volumeMounts:
        - name: work
          mountPath: /work
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          {{- if $migrations.enabled }}
          {{- include "common.db_migrate.dsn" . | nindent 10 }}
          {{- include "gen3-embeddings.waitForMigrations" . | nindent 10 }}
          {{- end }}
          cp {{ .Values.postgres.appUser.sqlFile | quote }} /work/app_user.sql
  containers:
    - name: app-user
      image: '{{ .Values.global.awshelper_container_image | default "quay.io/cdis/awshelper:master" }}'
      imagePullPolicy: IfNotPresent
      env:
        {{- include "common.db_migrate.env" . | nindent 8 }}
        {{- include "gen3-embeddings.adminPgEnv" . | nindent 8 }}
        - name: PGSSLMODE
          value: {{ $migrations.sslmode | quote }}
      volumeMounts:
        - name: work
          mountPath: /work
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          SECRET={{ $appUser.secretName | quote }}
          # Derived from the owner role unless set, since role names are cluster-wide and
          # owner names are already unique per database.
          APP_PGUSER={{ $appUser.username | quote }}
          APP_PGUSER="${APP_PGUSER:-${DB_MIGRATION_USER}_app}"
          if [ "${#APP_PGUSER}" -gt 63 ]; then
            echo "Role name $APP_PGUSER is longer than Postgres's 63-byte limit; set postgres.appUser.username."
            exit 1
          fi

          # The credentials live only in this Secret, which this Job creates on its first run and
          # reads on every later one. The chart does not render it: a rendered password needs
          # Helm's lookup, which returns nothing under `helm template`, so every ArgoCD sync
          # would generate a new one.
          if ! kubectl get secret "$SECRET" >/dev/null 2>&1; then
            echo "Creating $SECRET for role $APP_PGUSER..."
            # A concurrent run may create it first; the read below takes whichever won.
            kubectl create secret generic "$SECRET" \
              --from-literal=username="$APP_PGUSER" \
              --from-literal=password="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" || true
          fi
          SECRET_USER="$(kubectl get secret "$SECRET" -o jsonpath='{.data.username}' | base64 -d)"
          if [ "$SECRET_USER" != "$APP_PGUSER" ]; then
            echo "$SECRET holds role $SECRET_USER, but the configured role is $APP_PGUSER."
            echo "Delete the Secret and rerun this Job to switch roles."
            exit 1
          fi
          APP_PGPASSWORD="$(kubectl get secret "$SECRET" -o jsonpath='{.data.password}' | base64 -d)"

          # Creating the role takes CREATEROLE, which only the admin has. Setting the password on
          # every run keeps the role in step with the Secret. CONNECT is granted here because the
          # admin owns the database and the table owner does not.
          echo "Creating or updating role $APP_PGUSER as $ADMIN_PGUSER..."
          PGUSER="$ADMIN_PGUSER" PGPASSWORD="$ADMIN_PGPASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -v app_user="$APP_PGUSER" -v app_password="$APP_PGPASSWORD" \
            -v owner_user="$DB_MIGRATION_USER" <<'SQL'
          SELECT format(
              'DO $$ BEGIN RAISE EXCEPTION ''%%'', %L; END $$',
              format('The app role (%s) must differ from the admin and table owner roles.', :'app_user')
          )
          WHERE :'app_user' IN (current_user, :'owner_user') \gexec
          SELECT format(
              'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS',
              :'app_user', :'app_password'
          )
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
          SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
          SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'app_user') \gexec
          SQL
          # The table grants come from the service's own script, run as the role that owns the
          # tables, which can always grant on them. Its CONNECT grant is a no-op here.
          echo "Granting table privileges as $DB_MIGRATION_USER..."
          PGUSER="$DB_MIGRATION_USER" PGPASSWORD="$DB_MIGRATION_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -v app_user="$APP_PGUSER" -v app_password="$APP_PGPASSWORD" -f /work/app_user.sql
          kubectl patch secret "$SECRET" -p '{"data":{"rolecreated":"dHJ1ZQ=="}}'
          echo "App role $APP_PGUSER is ready."
{{- end }}

{{- $appUser := include "gen3-embeddings.appUser" . | fromYaml }}
{{- if $appUser.enabled }}
{{- $pod := include "gen3-embeddings.appUserPod" . }}
{{- /* The name hashes the pod template, so an unchanged deploy re-applies an identical Job and
       any change gets a new Job rather than failing on Job immutability. A rerun reads the
       existing Secret, so it changes nothing. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-appuser-{{ $pod | sha256sum | trunc 8 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    {{- $pod | nindent 4 }}
{{- end }}
