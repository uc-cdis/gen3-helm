{{- if not .Values.global.externalSecrets.deploy }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gen3-embeddings.envSecretName" . }}
{{- if and .Values.secretEnv (not (kindIs "map" .Values.secretEnv)) }}
{{- fail (printf "gen3-embeddings.secretEnv must be a map of NAME: value, got %s." (kindOf .Values.secretEnv)) }}
{{- end }}
{{- if .Values.secretEnv }}
data:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ include "gen3-embeddings.envValue" (dict "field" "secretEnv" "key" $k "value" $v) | b64enc | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
