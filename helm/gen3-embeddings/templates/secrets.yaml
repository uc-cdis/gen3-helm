{{- if or (not .Values.global.externalSecrets.deploy) (and .Values.global.externalSecrets.deploy .Values.externalSecrets.createK8sGen3EmbeddingsSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: gen3embeddings-g3auto
stringData:
  {{- $randomPass := include "gen3-embeddings.adminLogins" . }}
  base64Authz.txt: {{  $randomPass | quote | b64enc }}
  {{- /* Database connection comes from the PG* environment variables, sourced from the
         gen3-embeddings-dbcreds Secret that common.db-secret builds out of .Values.postgres. */}}
  gen3-embeddings.env: |
    DEBUG={{ .Values.debug}}
    ADMIN_LOGINS={{ $randomPass  }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gen3-embeddings.envSecretName" . }}
{{- if .Values.secretEnv }}
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- else }}
stringData: {}
{{- end }}
{{- end }}
