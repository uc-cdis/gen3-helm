apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen3-embeddings-deployment
  labels:
    {{- include "gen3-embeddings.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gen3-embeddings.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "gen3-embeddings.selectorLabels" . | nindent 8 }}
        {{- include "common.extraLabels" . | nindent 8 }}
        # gen3 networkpolicy labels
        netnolimit: 'yes'
        public: 'yes'
        userhelper: 'yes'
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- $metricsEnabled := .Values.metricsEnabled }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = .Values.global.metricsEnabled }}
      {{- end }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = true }}
      {{- end }}

      {{- if $metricsEnabled }}
        {{- include "common.grafanaAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      {{- include "common.TopologySpread" . | nindent 6 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- /* Secret settings arrive as environment variables, ahead of the `env` entries
                 below so that a name set in both resolves to the `env` value. */}}
          envFrom:
            - secretRef:
                name: {{ include "gen3-embeddings.envSecretName" . }}
                optional: true
          env:
            {{- /* An `env` entry whose name is also in extraEnv is left out, so each name appears
                   once. A second entry with the same name breaks the patch Helm upgrades with. */}}
            {{- range .Values.env }}
            {{- if not (and (kindIs "map" $.Values.extraEnv) (hasKey $.Values.extraEnv .name)) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: host
                  optional: false
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: port
                  optional: false
            {{- $appUser := include "gen3-embeddings.appUser" . | fromYaml }}
            {{- $credsSecret := ternary $appUser.secretName "gen3-embeddings-dbcreds" $appUser.enabled }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $credsSecret }}
                  key: username
                  optional: false
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $credsSecret }}
                  key: password
                  optional: false
            {{- if $appUser.enabled }}
            {{- /* Startup gate: absent until the app-user Job has created the role and granted it. */}}
            - name: APPUSERREADY
              valueFrom:
                secretKeyRef:
                  name: {{ $appUser.secretName }}
                  key: rolecreated
                  optional: false
            {{- end }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: database
                  optional: false
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            - name: DBREADY
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: dbcreated
                  optional: false
            {{- if not (kindIs "map" .Values.extraEnv) }}
            {{- fail (printf "gen3-embeddings.extraEnv must be a map of NAME: value, got %s. Use `valueFrom` entries in `env` instead." (kindOf .Values.extraEnv)) }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ include "gen3-embeddings.envValue" (dict "field" "extraEnv" "key" $k "value" $v) | quote }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- /* Only wait when something is going to migrate. With migrations disabled there is no
             Job to wait for, and the poll below would never see a clean status. Resolved through
             common.db_migrate.settings so the gate cannot disagree with common.db_migrate_job
             about whether a Job exists. */}}
      {{- $migrations := include "common.db_migrate.settings" . | fromYaml }}
      {{- if $migrations.enabled }}
      initContainers:
        - name: gen3-embeddings-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GEN3_DEBUG
              value: "False"
            {{- include "common.db_migrate.env" . | nindent 12 }}

          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- include "common.db_migrate.dsn" . | nindent 14 }}
              {{- include "gen3-embeddings.waitForMigrations" . | nindent 14 }}
      {{- end }}