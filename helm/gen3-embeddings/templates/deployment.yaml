apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen3-embeddings-deployment
  labels:
    {{- include "gen3-embeddings.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gen3-embeddings.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "gen3-embeddings.selectorLabels" . | nindent 8 }}
        {{- include "common.extraLabels" . | nindent 8 }}
        # gen3 networkpolicy labels
        netnolimit: 'yes'
        public: 'yes'
        userhelper: 'yes'
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- $metricsEnabled := .Values.metricsEnabled }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = .Values.global.metricsEnabled }}
      {{- end }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = true }}
      {{- end }}

      {{- if $metricsEnabled }}
        {{- include "common.grafanaAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      {{- include "common.TopologySpread" . | nindent 6 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      volumes:
        - name: gen3-embeddings-g3auto-volume
          secret:
            secretName: gen3embeddings-g3auto
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- /* Secret settings arrive as environment variables, ahead of the `env` entries
                 below so that a name set in both resolves to the `env` value. */}}
          envFrom:
            - secretRef:
                name: {{ include "gen3-embeddings.envSecretName" . }}
                optional: true
          env:
            {{- toYaml .Values.env | nindent 12 }}
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: host
                  optional: false
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: port
                  optional: false
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: username
                  optional: false
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: password
                  optional: false
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: database
                  optional: false
            - name: CONFIG_PATH
              value: /services/gen3_embeddings/.env
            {{- if eq .Values.global.dev false }}
            - name: FENCE_URL
              value: https://{{ .Values.global.hostname }}/user
            {{- else }}
            - name: FENCE_URL
              value: {{ default "http://fence-service" .Values.global.fenceURL | quote }}
            {{- end }}
            - name: DBREADY
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: dbcreated
                  optional: false
            {{- if not (kindIs "map" .Values.extraEnv) }}
            {{- fail (printf "gen3-embeddings.extraEnv must be a map of NAME: value, got %s. Use `valueFrom` entries in `env` instead." (kindOf .Values.extraEnv)) }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            {{- if or (kindIs "map" $v) (kindIs "slice" $v) }}
            {{- fail (printf "gen3-embeddings.extraEnv[%s] must be a scalar, got %s. Use `env` for anything needing `valueFrom`." $k (kindOf $v)) }}
            {{- end }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- /* Only wait when something is going to migrate. With migrations disabled there is no
             Job to wait for, and the poll below would never see a clean status. */}}
      {{- if dig "migrations" "enabled" false (.Values.postgres | default dict) }}
      initContainers:
        - name: gen3-embeddings-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GEN3_DEBUG
              value: "False"
            # Admin/master connection – same pattern as db_setup_job
            - name: PGPASSWORD
              {{- if $.Values.global.dev }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
                  optional: false
              {{- else if $.Values.global.postgres.externalSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.postgres.externalSecret }}
                  key: password
                  optional: false
              {{- else }}
              value: {{ .Values.global.postgres.master.password | quote }}
              {{- end }}
            - name: PGUSER
              {{- if $.Values.global.postgres.externalSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.postgres.externalSecret }}
                  key: username
                  optional: false
              {{- else }}
              value: {{ .Values.global.postgres.master.username | quote }}
              {{- end }}
            - name: PGPORT
              {{- if $.Values.global.postgres.externalSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.postgres.externalSecret }}
                  key: port
                  optional: false
              {{- else }}
              value: {{ .Values.global.postgres.master.port | quote }}
              {{- end }}
            - name: PGHOST
              {{- if $.Values.global.dev }}
              value: "{{ .Release.Name }}-postgresql"
              {{- else if $.Values.global.postgres.externalSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.postgres.externalSecret }}
                  key: host
                  optional: false
              {{- else }}
              value: {{ .Values.global.postgres.master.host | quote }}
              {{- end }}

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: database
                  optional: false
            - name: DBREADY
              valueFrom:
                secretKeyRef:
                  name: gen3-embeddings-dbcreds
                  key: dbcreated
                  optional: false

          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- $mig := dig "migrations" dict (.Values.postgres | default dict) }}
              # Password omitted from the DSN on purpose; lib/pq picks up PGPASSWORD from the
              # environment, so a password containing @, / or : cannot corrupt the URL.
              DATABASE_URL="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode={{ dig "sslmode" "disable" $mig }}"
              # Waits rather than migrates: the dbmigrate Job is the only writer. Polls the
              # database instead of the Job because ttlSecondsAfterFinished reaps the Job, so a
              # replica starting later would wait on an object that no longer exists.
              #
              # dbmate status --quiet exits 0 with nothing pending, 1 with migrations pending, and
              # 2 on any other error. Treating 2 as "keep waiting" would turn a bad DSN into a pod
              # that hangs in Init forever, so it gets a bounded retry.
              attempts=0
              until_ready() {
                set +e
                dbmate -u "$DATABASE_URL" -d {{ dig "dir" "" $mig | quote }} status --quiet
                rc=$?
                set -e
                return $rc
              }
              while true; do
                if until_ready; then
                  echo "Migrations up to date."
                  break
                fi
                if [ "$rc" -eq 1 ]; then
                  attempts=0
                  echo "Waiting for migrations to be applied..."
                else
                  attempts=$((attempts + 1))
                  echo "dbmate status failed (rc=$rc), attempt ${attempts}/30"
                  if [ "$attempts" -ge 30 ]; then
                    echo "Giving up waiting for migrations."
                    exit 1
                  fi
                fi
                sleep 5
              done
      {{- end }}