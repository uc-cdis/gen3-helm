{{ if .Values.global.externalSecrets.deploy }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gen3-embeddings.envSecretName" . }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: {{ include "gen3-embeddings.envSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Every property of the Secrets Manager secret becomes its own key, so a new setting needs a
  # JSON property there and no change here. Keys have to be valid environment variable names,
  # which is why the database connection cannot come through here: envFrom skips keys that are
  # not identifiers, and <chart>-dbcreds is projected with individual secretKeyRefs instead.
  dataFrom:
  - extract:
      #name of secret in secrets manager
      key: {{ include "gen3-embeddings.envSecretName" . }}
{{- end }}
---
{{- if and .Values.global.externalSecrets.deploy (not .Values.global.externalSecrets.createLocalK8sSecret) }}
{{ include "common.externalSecret.db" . }}
{{- end }}
