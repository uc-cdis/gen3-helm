{{ if .Values.global.externalSecrets.deploy }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gen3embeddings-g3auto
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: gen3embeddings-g3auto
    creationPolicy: Owner
  data:
  - secretKey: base64Authz.txt
    remoteRef:
      #name of secret in secrets manager
      key: {{include "gen3embeddings-g3auto" .}}
      property: base64Authz.txt
  - secretKey: dbcreds.json
    remoteRef:
      #name of secret in secrets manager
      key: {{include "gen3embeddings-g3auto" .}}
      property: dbcreds.json
  - secretKey: gen3-embeddings.env
    remoteRef:
      #name of secret in secrets manager
      key: {{include "gen3embeddings-g3auto" .}}
      property: gen3-embeddings.env
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gen3-embeddings.envSecretName" . }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: {{ include "gen3-embeddings.envSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Every property of the Secrets Manager secret becomes its own key, so a new setting needs a
  # JSON property there and no change here. Keys have to be valid environment variable names,
  # which is why this cannot reuse gen3embeddings-g3auto: that one holds base64Authz.txt,
  # dbcreds.json and gen3-embeddings.env, and envFrom skips keys that are not identifiers.
  dataFrom:
  - extract:
      #name of secret in secrets manager
      key: {{ include "gen3-embeddings.envSecretName" . }}
{{- end }}
---
{{- if and .Values.global.externalSecrets.deploy (not .Values.global.externalSecrets.createLocalK8sSecret) }}
{{ include "common.externalSecret.db" . }}
{{- end }}