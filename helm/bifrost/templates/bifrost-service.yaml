{{- if .Values.bifrost.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-bifrost
  labels:
    {{- include "ai-gateway.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "bifrost") | nindent 4 }}
spec:
  type: {{ .Values.bifrost.service.type }}
  selector:
    {{- include "ai-gateway.componentSelector" (dict "root" . "component" "bifrost") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.bifrost.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
