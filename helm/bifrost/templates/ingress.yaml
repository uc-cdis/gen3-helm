{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-gateway.fullname" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          {{- $serviceName := printf "%s-%s" (include "ai-gateway.fullname" $) .service -}}
          {{- $servicePort := $.Values.orgStandardsMcp.service.port -}}
          {{- if eq .service "headroom" -}}
            {{- $serviceName = printf "%s-headroom" (include "ai-gateway.fullname" $) -}}
            {{- $servicePort = $.Values.headroom.service.port -}}
          {{- else if eq .service "adminApi" -}}
            {{- $serviceName = printf "%s-admin-api" (include "ai-gateway.fullname" $) -}}
            {{- $servicePort = $.Values.adminApi.service.port -}}
          {{- else if eq .service "orgStandardsMcp" -}}
            {{- $serviceName = printf "%s-org-standards-mcp" (include "ai-gateway.fullname" $) -}}
            {{- $servicePort = $.Values.orgStandardsMcp.service.port -}}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}