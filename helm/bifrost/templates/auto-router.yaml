{{- if .Values.autoRouter.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-auto-router
  labels:
    {{- include "ai-gateway.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "auto-router") | nindent 4 }}
spec:
  replicas: {{ .Values.autoRouter.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway.componentSelector" (dict "root" . "component" "auto-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-gateway.componentSelector" (dict "root" . "component" "auto-router") | nindent 8 }}
    spec:
      {{- include "ai-gateway.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auto-router
          image: "{{ .Values.autoRouter.image.repository }}:{{ .Values.autoRouter.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: {{ .Values.autoRouter.service.port }}
          env:
            - name: AUTO_ROUTER_LISTEN_ADDR
              value: 0.0.0.0:{{ .Values.autoRouter.service.port }}
            - name: AUTO_ROUTER_POLL_SECONDS
              value: {{ .Values.autoRouter.pollSeconds | quote }}
            - name: AUTO_ROUTER_ORG_BUDGET_LIMIT_USD
              value: {{ .Values.autoRouter.orgBudgetLimitUsd | quote }}
            - name: AUTO_ROUTER_HARD_STOP_AT_CAP
              value: {{ .Values.autoRouter.hardStopAtCap | quote }}
            - name: AUTO_ROUTER_STAGE1_THRESHOLD
              value: {{ .Values.autoRouter.thresholds.stage1 | quote }}
            - name: AUTO_ROUTER_STAGE2_THRESHOLD
              value: {{ .Values.autoRouter.thresholds.stage2 | quote }}
            - name: AUTO_ROUTER_STAGE3_THRESHOLD
              value: {{ .Values.autoRouter.thresholds.stage3 | quote }}
            - name: AUTO_ROUTER_DRY_RUN
              value: {{ .Values.autoRouter.dryRun | quote }}
            - name: AUTO_ROUTER_PATCH_PATH_TEMPLATE
              value: {{ .Values.autoRouter.routingPatchPathTemplate | quote }}
            - name: AUTO_ROUTER_MODELS_PREMIUM
              value: {{ join "," .Values.autoRouter.models.premium | quote }}
            - name: AUTO_ROUTER_MODELS_BALANCED
              value: {{ join "," .Values.autoRouter.models.balanced | quote }}
            - name: AUTO_ROUTER_MODELS_CHEAP
              value: {{ join "," .Values.autoRouter.models.cheap | quote }}
            - name: AUTO_ROUTER_MODELS_ONPREM
              value: {{ join "," .Values.autoRouter.models.onprem | quote }}
            - name: BIFROST_URL
              value: http://{{ include "ai-gateway.fullname" . }}-bifrost:{{ .Values.bifrost.service.port }}
            - name: BIFROST_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-bifrost-admin
                  key: token
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-auto-router
  labels:
    {{- include "ai-gateway.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "auto-router") | nindent 4 }}
spec:
  type: {{ .Values.autoRouter.service.type }}
  selector:
    {{- include "ai-gateway.componentSelector" (dict "root" . "component" "auto-router") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.autoRouter.service.port }}
      targetPort: http
{{- end }}
