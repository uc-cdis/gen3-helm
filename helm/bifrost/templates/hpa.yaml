{{- if and .Values.bifrost.enabled .Values.bifrost.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-gateway.fullname" . }}-bifrost
  labels:
    {{- include "ai-gateway.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "bifrost") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-gateway.fullname" . }}-bifrost
  minReplicas: {{ .Values.bifrost.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.bifrost.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.bifrost.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.bifrost.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.bifrost.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
        - type: {{ .Values.bifrost.autoscaling.behavior.scaleUp.policy.type }}
          value: {{ .Values.bifrost.autoscaling.behavior.scaleUp.policy.value }}
          periodSeconds: {{ .Values.bifrost.autoscaling.behavior.scaleUp.policy.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.bifrost.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        - type: {{ .Values.bifrost.autoscaling.behavior.scaleDown.policy.type }}
          value: {{ .Values.bifrost.autoscaling.behavior.scaleDown.policy.value }}
          periodSeconds: {{ .Values.bifrost.autoscaling.behavior.scaleDown.policy.periodSeconds }}
---
{{- end }}

