{{- if and .Values.bifrost.enabled .Values.bifrost.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-gateway.fullname" . }}-bifrost
spec:
  minAvailable: {{ .Values.bifrost.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ai-gateway.componentSelector" (dict "root" . "component" "bifrost") | nindent 6 }}
---
{{- end }}

