{{- if .Values.hotNode.enabled }}

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hot-node-lowest-priority
value: -1000000
globalDefault: false
description: "This priority class marks a pod as extremely low priority, for hot nodes"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hot-node-prepuller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hot-node-prepuller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create","get","list","watch","delete","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hot-node-prepuller
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: hot-node-prepuller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hot-node-prepuller
---
{{- if .Values.hotNode.jupyter }}
{{- $job := include "hatchery.prepullJob" (dict "root" $ "app" "jupyterhub-prepuller" "tolerations" (list (dict "key" "role" "operator" "Equal" "value" "jupyter" "effect" "NoSchedule"))) }}
{{- $jobHash := $job | sha256sum | trunc 8 }}
apiVersion: v1
kind: ConfigMap
metadata:
  # Immutable, so the name carries a hash of the content: any change to the job renames the
  # ConfigMap, which rolls the hot-node Deployments and reruns the prepull.
  name: hot-node-job-{{ $jobHash }}
  namespace: {{ $.Release.Namespace }}
immutable: true
data:
  job.yaml: |
    {{- $job | nindent 4 }}
---
{{- range .Values.hotNode.availabilityZones }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hot-node-{{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: hot-node-{{ . }}
    app.kubernetes.io/instance: {{ $.Release.Name }}-{{ . }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    availability-zone: {{ . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hot-node-{{ . }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hot-node-{{ . }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        availability-zone: {{ . }}
    spec:
      tolerations:
      - key: "role"
        operator: "Equal"
        value: "jupyter"
        effect: "NoSchedule"
      priorityClassName: hot-node-lowest-priority
      nodeSelector:
        role: jupyter
        topology.kubernetes.io/zone: {{ . }}
      terminationGracePeriodSeconds: 0
      # Needs a token so kubectl can auth to the API
      automountServiceAccountToken: true
      serviceAccountName: hot-node-prepuller
      initContainers:
      - name: init-hot-node
        image: {{ $.Values.global.awshelper_container_image | default "quay.io/cdis/awshelper:master" }}
        command: ["/bin/bash","-c"]
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: JOB_HASH
            value: {{ $jobHash | quote }}
        args:
          - |
            set -euo pipefail
            # The Job name comes from the job spec and the node, never the clock, so a restarted
            # pod re-applies the same Job (a no-op) instead of creating a new one.
            node_hash=$(printf '%s' "$NODE_NAME" | sha256sum | cut -c1-10)
            export JOB_NAME="jupyterhub-prepuller-${JOB_HASH}-${node_hash}"
            envsubst '$JOB_NAME $NODE_NAME' < /job.yaml | kubectl apply -f -
        volumeMounts:
        - name: job-yaml
          mountPath: /job.yaml
          subPath: job.yaml

      containers:
      - name: hot-node
        image: busybox:latest
        command: ["sleep", "infinity"]
        resources:
          requests:
            memory: {{ $.Values.hotNode.workspaceCapacityReservation.memory }}
            cpu: {{ $.Values.hotNode.workspaceCapacityReservation.cpu }}
          limits:
            memory: {{ $.Values.hotNode.workspaceCapacityReservation.memory }}
            cpu: {{ $.Values.hotNode.workspaceCapacityReservation.cpu }}
      volumes:
      - name: job-yaml
        configMap:
          name: hot-node-job-{{ $jobHash }}
---
{{- end }}
{{- end }}
{{- end }}
