apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen3-fhir-proxy-deployment
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "gen3-fhir-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.global.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gen3-fhir-proxy.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "gen3-fhir-proxy.selectorLabels" . | nindent 8 }}
        netnolimit: "yes"
        public: "yes"
      annotations:
        {{- $metricsEnabled := .Values.metricsEnabled }}
        {{- if eq $metricsEnabled nil }}
          {{- $metricsEnabled = true }}
        {{- end }}
        {{- if $metricsEnabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        {{- end }}
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      {{- include "common.TopologySpread" . | nindent 6 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if or .Values.volumes .Values.extraVolumes }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        - name: gen3-fhir-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP

          {{- if or .Values.volumeMounts .Values.extraVolumeMounts }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          env:
            - name: DEBUG
              value: {{ .Values.config.debug | quote }}
            - name: GEN3_FHIR_PROXY_URL_PREFIX
              value: {{ .Values.config.urlPrefix | quote }}
            - name: FHIR_SERVER_URL
              value: {{ .Values.config.fhirServerUrl | quote }}
            - name: FHIR_BACKEND_TYPE
              value: {{ .Values.config.fhirBackendType | default "" | quote }}
            - name: FHIR_BACKEND_GCP_SA_CREDS
              value: {{ .Values.config.fhirBackendGcpSaCreds | default "" | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.config.fhirBackendGcpSaCreds | default "" | quote }}
            - name: ARBORIST_URL
              value: {{ .Values.config.arboristUrl | quote }}
            - name: IS_UPSTREAM_CALLER_TRUSTED_REVERSE_PROXY
              value: {{ .Values.config.isUpstreamCallerTrustedReverseProxy | quote }}
            - name: ENABLE_PROMETHEUS_METRICS
              value: {{ .Values.config.enablePrometheusMetrics | quote }}
            - name: PROMETHEUS_MULTIPROC_DIR
              value: {{ .Values.config.prometheusMultiprocDir | quote }}
            - name: ENABLE_OPENTELEMETRY_TRACES
              value: {{ .Values.config.enableOpenTelemetryTraces | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}