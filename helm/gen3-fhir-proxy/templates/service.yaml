apiVersion: v1
kind: Service
metadata:
  name: gen3-fhir-proxy
  labels:
    {{- include "gen3-fhir-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "gen3-fhir-proxy.selectorLabels" . | nindent 4 }}