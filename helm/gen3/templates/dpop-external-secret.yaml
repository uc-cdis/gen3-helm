{{- if and (.Values.global.externalSecrets.deploy) (.Values.global.externalSecrets.createDpopSecret) }}
apiVersion: {{ include "common.externalSecrets.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: gen3-dpop
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: gen3-dpop
    creationPolicy: Owner
  data:
  - secretKey: DPOP_SHARED_SECRET #pragma: allowlist secret
    remoteRef:
      #name of secret in secrets manager
      key: {{ .Values.global.externalSecrets.dpopSecretName | default "gen3-dpop" }}
      property: DPOP_SHARED_SECRET
{{- end }}
