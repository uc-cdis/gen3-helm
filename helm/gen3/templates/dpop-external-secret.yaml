{{- if and (.Values.global.externalSecrets.deploy) (.Values.global.createDpopSecret) }}
apiVersion: {{ include "common.externalSecrets.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: gen3-dpop
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: gen3-dpop
    creationPolicy: Owner
  data:
  - secretKey: DPOP_SHARED_SECRET #pragma: allowlist secret
    remoteRef:
      #name of secret in secrets manager
      {{- $dpopSecretName := "gen3-dpop" }}
      {{- with .Values.global.environment }}{{ $dpopSecretName = printf "%s-gen3-dpop" . }}{{ end }}
      key: {{ $dpopSecretName }}
      property: DPOP_SHARED_SECRET
{{- end }}
