{{- /* ambassador and workspace-proxy both serve /lw-workspace/proxy/ in revproxy; never allow both. */ -}}
{{- $jeg := (.Values.global.jeg).enabled | default false }}
{{- $wp := index .Values "workspace-proxy" | default dict }}
{{- $wpEnabled := hasKey $wp "enabled" | ternary $wp.enabled $jeg }}
{{- if and .Values.ambassador.enabled (or $jeg $wpEnabled) }}
{{- fail "ambassador.enabled cannot be combined with global.jeg.enabled / workspace-proxy.enabled: both route /lw-workspace/proxy/. Set ambassador.enabled=false." }}
{{- end }}
{{- if and $wpEnabled (not $jeg) }}
{{- fail "workspace-proxy is enabled but global.jeg.enabled is false, so revproxy would still route /lw-workspace/proxy/ to ambassador. Set global.jeg.enabled=true." }}
{{- end }}
