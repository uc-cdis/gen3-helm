{{- if and (not .Values.global.externalSecrets.deploy) (include "gen3.dpop.enabled" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: gen3-dpop
stringData:
  DPOP_SHARED_SECRET: {{ .Values.global.dpopSharedSecret | required "global.dpopSharedSecret is required when DPoP is enabled (fence.FENCE_CONFIG_PUBLIC.DPOP_ENABLED or global.createDpopSecret) and global.externalSecrets.deploy is false. Generate one with: openssl rand -base64 64" | quote }}
{{- end }}
