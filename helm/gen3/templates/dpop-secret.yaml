{{- if and (not .Values.global.externalSecrets.deploy) (.Values.global.createDpopSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: gen3-dpop
stringData:
  DPOP_SHARED_SECRET: {{ .Values.global.dpopSharedSecret | required "global.dpopSharedSecret is required when global.createDpopSecret is set" | quote }}
{{- end }}
