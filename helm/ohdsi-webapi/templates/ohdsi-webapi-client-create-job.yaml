{{- if and (.Values.oidc_job_enabled) (.Values.externalSecrets.createOhdsiOidcClientSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ohdsi-webapi-client-job
spec:
  template:
    metadata:
      labels:
        app: gen3job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: "webapi-secrets"
      volumes:
        - name: config-volume
          secret:
            secretName: "fence-config"
        - name: shared-volume
          emptyDir: {}
      initContainers:
        - name: wait-for-fence
          image: {{ .Values.image.utilImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args: ["while [ $(curl -sw '%{http_code}' {{ .Values.fenceUrl }} -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for fence...'; done"]
      containers:
        - name: fence-client
          image: {{ .Values.global.fence_container_image | default "quay.io/cdis/fence:master" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash"]
          env:
          - name: PGHOST
            valueFrom:
              secretKeyRef:
                key: host
                name: fence-dbcreds
                optional: false
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                key: username
                name: fence-dbcreds
                optional: false
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: fence-dbcreds
                optional: false
          - name: PGDB
            valueFrom:
              secretKeyRef:
                key: database
                name: fence-dbcreds
                optional: false
          - name: DB
            value: postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/$(PGDB)
          - name: PYTHONPATH
            value: /var/www/fence
          - name: FENCE_PUBLIC_CONFIG
            valueFrom:
              configMapKeyRef:
                name: manifest-fence
                key: fence-config-public.yaml
                optional: true
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ohdsi-oidc-client
                key: client_id
                optional: true
          args:
            - "-c"
            - |
              export ATLAS_HOSTNAME="atlas.{{ .Values.global.hostname }}"
              echo "Trying to generate atlas OIDC client for hostname: $ATLAS_HOSTNAME..."

              if fence-create client-list 2>/dev/null | grep -q "'client_id': '${OIDC_CLIENT_ID}'"; then
                echo "Client ${OIDC_CLIENT_ID} exists"
                echo "Client exists- die happy" > /shared/client_id
              else
                echo "Client ${OIDC_CLIENT_ID} does not exist, creating..."
                secrets=$(fence-create client-create \
                  --client atlas \
                  --urls "https://${ATLAS_HOSTNAME}/WebAPI/user/oauth/callback?client_name=OidcClient" \
                  --username atlas \
                  --auto-approve \
                  --allowed-scopes openid user | tail -1)
                if [[ ! $secrets =~ (\'(.*)\', \'(.*)\') ]]; then
                  echo "Failed generating OIDC client for atlas: $secrets"
                  echo "Attempting to delete existing client and recreate..."
                  fence-create client-delete --client atlas 2>/dev/null || echo "No existing client to delete or deletion failed"
                  secrets=$(fence-create client-create \
                    --client atlas \
                    --urls "https://${ATLAS_HOSTNAME}/WebAPI/user/oauth/callback?client_name=OidcClient" \
                    --username atlas \
                    --auto-approve \
                    --allowed-scopes openid user | tail -1)
                  if [[ ! $secrets =~ (\'(.*)\', \'(.*)\') ]]; then
                    echo "Failed generating OIDC client for atlas even after deletion: $secrets"
                    exit 1
                  else
                    echo "Successfully recreated client after deletion"
                  fi
                fi
                client_id="${BASH_REMATCH[2]}"
                client_secret="${BASH_REMATCH[3]}"
                echo "client_id: $client_id"
                echo -n "$client_id" > /shared/client_id
                echo -n "$client_secret" > /shared/client_secret
              fi
          volumeMounts:
            - name: "shared-volume"
              mountPath: "/shared"
            - name: "config-volume"
              readOnly: true
              mountPath: "/var/www/fence/fence-config.yaml"
              subPath: fence-config.yaml
        - name: kubectl
          image: {{ .Values.image.utilImage }}
          volumeMounts:
            - name: "shared-volume"
              mountPath: "/shared"
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              echo "waiting for /shared/client_id"
              while [ ! -e /shared/client_id ]
              do
                echo "..."
                sleep 5
              done
              if grep -q "happy" /shared/client_id; then
                echo "Client already exists- do nothing."
                exit 0
              else
                echo "Updating k8s secrets ohdsi-oidc-client and ohdsi-webapi-config"
                CLIENT_ID=$(cat /shared/client_id | base64)
                CLIENT_SECRET=$(cat /shared/client_secret | base64)
                kubectl patch secret/ohdsi-oidc-client \
                  --patch="{\"data\":{\"client_id\":\"${CLIENT_ID}\",\"client_secret\":\"${CLIENT_SECRET}\"}}"
              fi
{{- end }}
