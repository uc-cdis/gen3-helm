{{- if and .Values.global.netPolicy.enabled .Values.grpcLoadBalancer.enabled }}
# Remote agents connect from outside the cluster through the gRPC load balancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conduit-grpc-ingress-netpolicy
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "conduit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.grpcLoadBalancer.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.ports.grpc }}
          protocol: TCP
{{- end }}
