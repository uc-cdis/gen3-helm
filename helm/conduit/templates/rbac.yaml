{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conduit.serviceAccountName" . }}
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conduit-server
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
rules:
  # The kubernetes cert backend keeps the CA, server and per-agent certs in Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "update", "create"]
  # The leader labels its own pod so the active-only Services select it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conduit-server
  labels:
    {{- include "conduit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conduit-server
subjects:
  - kind: ServiceAccount
    name: {{ include "conduit.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
