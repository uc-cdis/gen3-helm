{{- if .Values.monitoring.enabled }}
# Allow the monitoring stack (Grafana Alloy) to scrape /metrics on gen3 pods.
# Without this, allow-nothing-netpolicy drops all cross-namespace ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape-netpolicy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      {{- with .Values.monitoring.podSelector }}
      podSelector:
        matchLabels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
{{- end }}
