# vectis-overlays defaults; override per environment in gitops values.


global:
  externalSecrets:
    clusterSecretStoreRef: ""

guppyCompat:
  enabled: false
  replicaCount: 1
  serviceAccount:
    create: true
    name: guppy-compat-service
    annotations: {}
  image:
    repository: quay.io/cdis/gen3-vectis
    tag: guppy-compat-v1
    pullPolicy: Always
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    GUPPY_COMPAT_MAX_LIMIT: "5000"

siemService:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: siem-service
    annotations: {}
  image:
    repository: quay.io/cdis/gen3-vectis
    tag: siem-service-v1
    pullPolicy: Always
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    DB_SCHEMA: "vectis"
    SIEM_DEFAULT_LIMIT: "250"
    SIEM_MAX_LIMIT: "2000"
    SIEM_VIEWS_S3_BUCKET: ""
    SIEM_VIEWS_S3_KEY: "siem/views.json"
    SIEM_VIEWS_S3_ENABLED: "false"

searchAuthProxy:
  enabled: true
  replicaCount: 1
  serviceName: search-auth-proxy
  serviceAccount:
    create: true
    name: search-auth-proxy
    annotations: {}
  image:
    repository: quay.io/cdis/gen3-vectis
    tag: search-auth-proxy-v1
    pullPolicy: Always
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    SEARCH_PROXY_DEFAULT_LIMIT: "50"
    SEARCH_PROXY_MAX_LIMIT: "1000"
    SEARCH_API_TLS_VERIFY: ""
  # snapshot bucket for /snapshots/*; empty disables it
  snapshotsBucket: ""
  snapshotsKeyPrefix: "snapshots/"
  apiGateway:
    apiId: ""
    region: "us-east-1"
  # execute-api DNS override (public API Gateway IPs) when the VPC endpoint returns 403
  hostAliases: []
  # Guppy -> SEARCH_API_BASE; SIEM indexes -> SIEM_SEARCH_BASE
  siemBackend:
    baseUrl: ""
    searchApiRequireSigv4: "true"
    siemRequireSigv4: "auto"
    indexes: "security_event,audit_event,threat_indicator"
  postgresDsnSecretRef:
    name: vectis-search-auth-proxy
    key: postgres_dsn
  # optional search-role secret; defaults to rds.secretName
  appDsnSecretName: ""

# CDK RDS secret for the postgres DSN ExternalSecret
rds:
  secretName: ""
  endpoint: ""
  port: "5432"
  database: postgres

# one-time schema/RLS migration Job; enable, run, then disable
migrations:
  enabled: false
