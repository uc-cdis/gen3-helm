# lmod assets live inside the user's running container and are served dynamically
# via workspace-proxy (not the static frontend-framework-service), so this block
# must come before the broader /api/workspace-assets/remote/ catch-all below.
location ^~ /api/workspace-assets/remote/lmod {
  if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
  }
  set $authz_resource "/workspace";
  set $authz_method "access";
  set $authz_service "jupyterhub";
  auth_request_set $remoteUser $upstream_http_REMOTE_USER;
  auth_request_set $remoteUser $upstream_http_X-Gen3-User-ID;
  auth_request_set $saved_set_cookie $upstream_http_set_cookie;
  auth_request /gen3-authz;
  if ($saved_set_cookie != "") {
    add_header Set-Cookie $saved_set_cookie always;
  }
  add_header Cache-Control "no-store";
  add_header Cross-Origin-Resource-Policy "cross-origin" always;
  proxy_set_header REMOTE_USER $remoteUser;
  proxy_set_header X-Gen3-User-ID $remoteUser;
  error_page 403 = @errorworkspace;

  set $upstream http://workspace-proxy-service.$namespace.svc.cluster.local:8080;
  rewrite ^/api/workspace-assets/remote/(lmod.*) /$1 break;
  proxy_pass $upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-URL-SCHEME https;
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
  client_max_body_size 0;
  proxy_read_timeout 600s;
}

