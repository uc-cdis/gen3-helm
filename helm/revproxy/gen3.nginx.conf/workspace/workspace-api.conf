# Workspace API routes (hatchery options/status/launch, gateway, kernel) are
# handled by the vectis Next.js app API routes — NOT workspace-proxy.
# Next.js rewrites /workspace-api/:path* → /api/:path* internally.
location ^~ /workspace-api/workspace/ {
    set $authz_resource "/workspace";
    set $authz_method "access";
    set $authz_service "jupyterhub";
    auth_request /gen3-authz;
    error_page 403 = @errorworkspace;
    set $upstream http://frontend-framework-service.$namespace.svc.cluster.local;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-URL-SCHEME https;
    client_max_body_size 0;
    proxy_read_timeout 600s;
}

# JupyterLab kernel tunnel (workspace-proxy handles per-user routing).
location ^~ /workspace-api/ {
    set $authz_resource "/workspace";
    set $authz_method "access";
    set $authz_service "jupyterhub";
    auth_request /gen3-authz;
    error_page 403 = @errorworkspace;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    set $upstream http://workspace-proxy-service.$namespace.svc.cluster.local:8080;
    rewrite ^/workspace-api/(.*) /api/$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-URL-SCHEME https;
    client_max_body_size 0;
    proxy_read_timeout 600s;
}

# gen3.auth (Python SDK) POSTs here from JupyterLite (Pyodide) to exchange an
# API key for a bearer token. The browser sends the access_token session cookie,
# which triggers the revproxy CSRF gate — but this endpoint authenticates via
# the API key in the JSON body; the cookie carries no auth value here.
# Stripping it bypasses both the nginx CSRF gate and Fence's own check_csrf()
# (which exits early when no session username is present).
# Safe: an attacker exploiting CSRF still needs to know the user's API key.
# See also: /user/register in fence-service.conf for the established precedent.
location = /user/credentials/cdis/access_token {
    proxy_set_header Cookie "";
    set $proxy_service  "fence";
    proxy_read_timeout          400;
    proxy_send_timeout          400;
    proxy_connect_timeout       400;
    set $upstream http://fence-service$des_domain;
    rewrite ^/user/(.*) /$1 break;
    proxy_pass $upstream;
}

location = /user/credentials/api/access_token {
    proxy_set_header Cookie "";
    set $proxy_service  "fence";
    proxy_read_timeout          400;
    proxy_send_timeout          400;
    proxy_connect_timeout       400;
    set $upstream http://fence-service$des_domain;
    rewrite ^/user/(.*) /$1 break;
    proxy_pass $upstream;
}
