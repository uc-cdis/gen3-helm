apiVersion: v2
name: s3-monitor
description: >
  s3-monitor (ActiveMQ + DuckDB): drains an SQS queue of S3 ObjectCreated notifications, publishes each new or
  changed object to Amazon MQ and records it in a Parquet lake. All code runs from the quay.io/cdis/s3-monitor
  image; this chart holds only configuration, the CronJob, an optional backfill Job and (with Crossplane) the IAM role.
type: application
version: 0.0.0
appVersion: "ActiveMQDuckDB"
