{{- /*
ServiceAccount of the CronJob and the backfill Job. With Crossplane it is annotated with the IRSA role created in
templates/aws/iam.yaml; without it, it takes serviceAccount.annotations (e.g. an existing role ARN).
*/ -}}
{{- if .Values.enabled }}
{{- $crossplaneEnabled := include "s3monitor.crossplaneEnabled" . }}
{{- $sas := list (dict "name" .Values.serviceAccount.name "role" (include "s3monitor.roleName" .) "annotations" .Values.serviceAccount.annotations "create" .Values.serviceAccount.create) }}
{{- range $sa := $sas }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "s3monitor.labels" $ | nindent 4 }}
  {{- if $crossplaneEnabled }}
  annotations:
    eks.amazonaws.com/role-arn: arn:{{ include "s3monitor.partition" $ }}:iam::{{ include "s3monitor.accountId" $ }}:role/{{ $sa.role }}
  {{- else }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
