{{- if .Values.enabled }}
{{- include "s3monitor.validate" . }}
# s3-monitor application config (schema: scripts/config.py in the image)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "s3monitor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "s3monitor.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.json: |-
    {{- include "s3monitor.configJson" . | nindent 4 }}
{{- end }}
