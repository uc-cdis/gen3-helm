{{- if .Values.enabled }}
{{- $v := .Values }}
# Runs /scripts/run.sh (consume.py) from the quay.io image: drains the SQS queue of S3 ObjectCreated notifications.
# No code lives in this chart. A run stops after config.sqs.maxRunSeconds, so runs never overlap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "s3monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "s3monitor.labels" . | nindent 4 }}
spec:
  schedule: {{ $v.schedule | quote }}
  concurrencyPolicy: {{ $v.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $v.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $v.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $v.backoffLimit }}
      ttlSecondsAfterFinished: {{ $v.ttlSecondsAfterFinished }}
      activeDeadlineSeconds: {{ add (int $v.config.sqs.maxRunSeconds) 300 }}
      template:
        {{- include "s3monitor.podTemplate" (list . nil) | nindent 8 }}
{{- end }}
