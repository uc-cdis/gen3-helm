global:
  # -- (string) Environment name; prefix of every AWS resource name (<environment>-<namespace>-...).
  environment: ""
  crossplane:
    # -- (bool) Create the IAM role with Crossplane. Off: annotate the ServiceAccount with an existing role (serviceAccount.annotations).
    enabled: false
    # -- (string) Crossplane ProviderConfig (crossplane-contrib/provider-aws).
    providerConfigName: provider-aws
    # -- (string) EKS cluster OIDC provider, without https://
    oidcProviderUrl: ""
    # -- (string) AWS account id. Quote it.
    accountId: ""

# -- (bool) Deploy s3-monitor. In the gen3 umbrella chart this is the `s3-monitor.enabled` condition.
enabled: false

# -- (string) Prefix of the Kubernetes object names (default s3-monitor-activemq).
fullnameOverride: ""

# -- (string) CronJob schedule. Each run drains the SQS queue (up to config.sqs.maxRunSeconds) and exits.
schedule: "*/5 * * * *"
# -- (string) CronJob concurrency policy. Keep Forbid: runs must not overlap.
concurrencyPolicy: Forbid
# -- (int) Successful Jobs to keep.
successfulJobsHistoryLimit: 3
# -- (int) Failed Jobs to keep.
failedJobsHistoryLimit: 1
# -- (int) Retries of a failed run.
backoffLimit: 2
# -- (int) Seconds before a finished Job is deleted.
ttlSecondsAfterFinished: 600
# -- (int) Time to finish after SIGTERM: current event, final lake write, SQS deletes.
terminationGracePeriodSeconds: 150
serviceAccount:
  # -- (bool) Create the CronJob's ServiceAccount.
  create: true
  # -- (string) ServiceAccount of the CronJob and the backfill Job. With Crossplane its IRSA role is <environment>-<namespace>-<name>.
  name: s3-monitor-activemq-sa
  # -- (map) Annotations when Crossplane is off (e.g. an existing eks.amazonaws.com/role-arn).
  annotations: {}
image:
  # -- (string) s3-monitor image (all Python and shell code). Built and pushed by the uc-cdis/s3-monitor repo.
  repository: quay.io/cdis/s3-monitor
  # -- (string) Image tag.
  tag: feature_sqs-consumer
  # -- (string) Optional sha256 digest. When set, the CronJob and the backfill Job run exactly this build.
  digest: ""
  # -- (string) Image pull policy.
  pullPolicy: IfNotPresent
# -- (list) Image pull secrets, if the quay.io repository is private.
imagePullSecrets: []
# -- (map) CronJob resources. DuckDB works in memory, so leave headroom.
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
aws:
  # -- (string) AWS region of the buckets, lake, queue and MQ.
  region: "us-east-1"
# Application config, rendered into the ConfigMap (name, account, region, eks come from the release).
config:
  # -- (bool) false = dry run: checks MQ secret, queue, buckets and lake; receives nothing.
  apply: false
  # -- (int) Max object size streamed to compute md5_checksum when the ETag is not the MD5 (0 = never).
  md5MaxBytes: 1073741824
  sqs:
    # -- (string) SQS queue the tenant buckets' ObjectCreated notifications go to (created outside the chart, e.g. CDK).
    queueUrl: ""
    # -- (int) Long-poll wait per receive (0-20 s).
    waitTimeSeconds: 10
    # -- (int) Messages per batch (1-10).
    batchSize: 10
    # -- (int) A run stops taking work after this. Queue VisibilityTimeout must be >= this + 120 (checked at start).
    maxRunSeconds: 240
    # -- (int) Write buffered rows to the lake after this many rows...
    flushRows: 1000
    # -- (int) ...or seconds, and at the end of the run.
    flushSeconds: 120
  # -- (bool) Use FIPS S3/STS endpoints.
  useFipsAwsEndpoints: true
  # -- (string) Optional role the CronJob assumes for S3 access (e.g. tenant buckets in another account).
  assumeRoleArn: ""
  lake:
    # -- (string) Bucket of the Parquet lake.
    bucket: ""
    # -- (string) Key prefix of the lake inside the bucket.
    prefix: "vectis"
    # -- (string) SSE-KMS key for all lake writes.
    kmsKeyArn: ""
    # -- (int) Hours between lake state snapshot rebuilds (done by recon).
    stateCompactHours: 24
  mq:
    # -- (list) Amazon MQ STOMP endpoints, e.g. stomp+ssl://b-xxxx-1.mq.us-east-1.amazonaws.com:61614
    stompEndpoints: []
    # -- (string) Secrets Manager ARN of the MQ credentials (username/password).
    secretArn: ""
    # -- (string) KMS key of that secret, if it is a customer-managed key.
    secretKmsKeyArn: ""
    # -- (string) Queue prefix; tenant queues are <prefix>.<tenant id> and <prefix>.<tenant id>.failures
    destinationPrefix: "/queue/s3monitor.ingest"
  recon:
    # -- (list) Amazon MQ broker names as CloudWatch shows them (e.g. ["gen3-mq-1", "gen3-mq-2"]); empty = skip the MQ check.
    mqCloudwatchBrokers: []
    # -- (int) Check the hour that ended this many hours ago (lag 1 at 10:15 -> 08:00-09:00 UTC).
    lagHours: 1
    # -- (int) Epoch-named folders are listed only this many minutes around the window.
    epochSlackMinutes: 60
    # -- (bool) Re-queue objects missing two hours in a row (apply: true only).
    requeueMissing: false
    # -- (int) Above this many missing objects, alarm instead of re-queueing.
    maxRequeue: 10000
    # -- (int) SQS messages sent are counted this many seconds past the window end (notification delay).
    sqsGraceSeconds: 120
    # -- (int) ActiveMQ enqueues are counted this many seconds past the window end (publish delay).
    mqGraceSeconds: 300
  # -- (list) Watched buckets: id, existing_bucket_name, prefix, suffix, lifecycle (active | draining | retired),
  # destination, failure_destination; kms_key_arn is used for IAM only.
  tenants: []
# Hourly recon CronJob (recon.py). Settings: config.recon.
recon:
  # -- (bool) Create the recon CronJob.
  enabled: false
  # -- (string) Recon schedule (default: 15 minutes past every hour).
  schedule: "15 * * * *"
# One-off backfill Job (backfill.py); turn off after the run.
backfill:
  # -- (bool) Create the backfill Job.
  enabled: false
  # -- (string) Tenant id to backfill.
  tenant: ""
  # -- (string) Optional narrower prefix inside the tenant's prefix.
  prefix: ""
  # -- (string) Optional: only objects modified on or after this date (YYYY-MM-DD).
  since: ""
  # -- (string) Unique per run (e.g. a date); a new value creates a new Job.
  runId: ""
iam:
  # -- (int) Tenants per CronJob IAM policy (IAM limits: 6,144 characters per policy, 10 policies per role).
  tenantsPerPolicy: 8
