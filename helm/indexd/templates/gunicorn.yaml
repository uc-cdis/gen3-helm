apiVersion: v1
kind: ConfigMap
metadata:
  name: gunicorn-conf
data:
  gunicorn.conf.py: |
    wsgi_app = "deployment.wsgi.wsgi:application"
    bind = "0.0.0.0:8000"
    workers = 5
    preload_app = True
    {{- with .Values.gunicorn.user }}
    user = {{ . | quote }}
    {{- end }}
    {{- with .Values.gunicorn.group }}
    group = {{ . | quote }}
    {{- end }}
    timeout = 300
    keepalive = 2
    keepalive_timeout = 5
