apiVersion: v1
kind: Service
metadata:
  name: gen3-ai-model-repo-service
  labels:
    {{- include "gen3-ai-model-repo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gen3-ai-model-repo.selectorLabels" . | nindent 4 }}